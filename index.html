<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAnalytics PTN - Portal Rekomendasi SNBP & SNBT</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div class="max-w-4xl mx-auto p-6 md:p-10">
    
    <!-- Header -->
    <header class="border-b border-slate-800 pb-6 mb-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-sky-400">EduAnalytics PTN</h1>
        <p class="text-slate-400 text-sm mt-1">Portal Analisis Peluang SNBP & Strategi SNBT Siswa</p>
      </div>
      <div id="statusBadge" class="px-3 py-1 bg-amber-950 border border-amber-600 text-amber-300 text-xs rounded-full font-semibold">
        Menghubungkan Data...
      </div>
    </header>

    <!-- Search Bar -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl mb-8 flex flex-col md:flex-row gap-4 items-center shadow-xl">
      <input id="studentInput" type="text" placeholder="Ketik ID Siswa (Contoh: S001)" 
        class="w-full md:flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 text-white" />
      <button onclick="analyzeStudent()" 
        class="w-full md:w-auto px-8 py-3 bg-sky-500 hover:bg-sky-600 text-white font-semibold rounded-xl transition shadow-lg shadow-sky-500/20">
        Analisis Siswa
      </button>
    </div>

    <!-- Output Analysis -->
    <div id="resultBox" class="hidden space-y-6">
      <!-- Info Siswa -->
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-wrap justify-between items-center gap-4">
        <div>
          <h2 id="outNama" class="text-2xl font-bold text-white"></h2>
          <p id="outKelas" class="text-slate-400 text-sm mt-0.5"></p>
        </div>
        <div id="outMapel" class="flex flex-wrap gap-2"></div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Card SNBP -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
          <div class="flex justify-between items-center mb-4">
            <span class="text-xs font-bold uppercase text-emerald-400 tracking-wider">Jalur Prestasi (SNBP)</span>
            <span id="outStatusSNBP" class="px-2.5 py-0.5 rounded text-xs font-bold"></span>
          </div>
          <p class="text-xs text-slate-400">Target Prodi & Kampus:</p>
          <h3 id="outTarget" class="text-lg font-bold text-white mb-6"></h3>
          
          <div class="flex items-baseline gap-2">
            <span id="outScoreSNBP" class="text-6xl font-black text-emerald-400"></span>
            <span class="text-slate-400 text-sm">Estimasi Peluang</span>
          </div>
          <p id="outKeketatan" class="text-xs text-slate-400 mt-4 border-t border-slate-800 pt-3"></p>
        </div>

        <!-- Card SNBT -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
          <span class="text-xs font-bold uppercase text-amber-400 tracking-wider">Jalur Tes (SNBT)</span>
          <p class="text-xs text-slate-400 mt-4">Target Skor Minimum UTBK:</p>
          <p id="outScoreSNBT" class="text-4xl font-extrabold text-amber-400 mt-1"></p>

          <p class="text-xs text-slate-400 mt-6 mb-2">Fokus Subtes Berdasarkan Mapel Unggulan:</p>
          <div id="outSubtes" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // MASUKKAN SPREADSHEET ID ANDA DI SINI
    const SPREADSHEET_ID = '1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Data_Siswa`;
    
    let database = [];

    // Load CSV Google Sheets
    async function loadData() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        database = parseCSV(text);
        
        const badge = document.getElementById('statusBadge');
        badge.innerText = `Online • ${database.length} Siswa Terdata`;
        badge.className = "px-3 py-1 bg-emerald-950 border border-emerald-600 text-emerald-300 text-xs rounded-full font-semibold";
      } catch (err) {
        const badge = document.getElementById('statusBadge');
        badge.innerText = "Gagal Mengambil Data Sheets";
        badge.className = "px-3 py-1 bg-rose-950 border border-rose-600 text-rose-300 text-xs rounded-full font-semibold";
      }
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
      
      return lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.replace(/"/g, '').trim());
        const entry = {};
        headers.forEach((h, i) => entry[h] = values[i]);
        return entry;
      });
    }

    function analyzeStudent() {
      const query = document.getElementById('studentInput').value.trim().toLowerCase();
      if (!query) return alert('Ketik ID atau Nama Siswa!');

      const student = database.find(s => 
        (s.ID && s.ID.toLowerCase() === query) || 
        (s.Nama && s.Nama.toLowerCase().includes(query))
      );

      if (!student) return alert('Data siswa tidak ditemukan!');

      // Kalkulasi Peluang SNBP
      const dayaTampung = parseFloat(student.Daya_Tampung) || 50;
      const peminat = parseFloat(student.Peminat) || 1000;
      const keketatan = (dayaTampung / peminat) * 100;
      
      const n1 = parseFloat(student.Nilai_1) || 80;
      const n2 = parseFloat(student.Nilai_2) || 80;
      const nTotal = parseFloat(student.Nilai_Rapor) || 80;
      
      const rawScore = (n1 * 0.25) + (n2 * 0.25) + (nTotal * 0.3) + (keketatan * 1.5);
      const snbpChance = Math.min(Math.round(rawScore), 95);

      // Render Hasil
      document.getElementById('outNama').innerText = student.Nama;
      document.getElementById('outKelas').innerText = `${student.Kelas} • ID: ${student.ID}`;
      
      document.getElementById('outMapel').innerHTML = `
        <span class="px-3 py-1 bg-slate-800 text-sky-300 border border-slate-700 rounded-lg text-xs font-medium">${student.Mapel_1}: ${student.Nilai_1}</span>
        <span class="px-3 py-1 bg-slate-800 text-sky-300 border border-slate-700 rounded-lg text-xs font-medium">${student.Mapel_2}: ${student.Nilai_2}</span>
        <span class="px-3 py-1 bg-slate-800 text-emerald-300 border border-slate-700 rounded-lg text-xs font-medium">Rata-rata: ${student.Nilai_Rapor}</span>
      `;

      document.getElementById('outTarget').innerText = `${student.Pilihan_Jurusan} - ${student.Pilihan_Kampus}`;
      document.getElementById('outScoreSNBP').innerText = `${snbpChance}%`;
      
      const statusBox = document.getElementById('outStatusSNBP');
      if (snbpChance >= 75) {
        statusBox.innerText = "Peluang Tinggi";
        statusBox.className = "px-2.5 py-0.5 rounded text-xs font-bold bg-emerald-950 text-emerald-400 border border-emerald-600";
      } else if (snbpChance >= 55) {
        statusBox.innerText = "Kompetitif / Moderat";
        statusBox.className = "px-2.5 py-0.5 rounded text-xs font-bold bg-amber-950 text-amber-400 border border-amber-600";
      } else {
        statusBox.innerText = "Tingkat Persaingan Ketat";
        statusBox.className = "px-2.5 py-0.5 rounded text-xs font-bold bg-rose-950 text-rose-400 border border-rose-600";
      }

      document.getElementById('outKeketatan').innerText = `Rasio Daya Tampung vs Peminat: ${keketatan.toFixed(2)}% (${dayaTampung}/${peminat})`;
      document.getElementById('outScoreSNBT').innerText = `${student.Min_UTBK || 650}+ Poin`;

      // Subtes SNBT
      let subtes = ["Penalaran Umum", "Pemahaman Bacaan & Menulis"];
      const mCombined = `${student.Mapel_1} ${student.Mapel_2}`.toLowerCase();
      if (mCombined.includes("matematika") || mCombined.includes("fisika") || mCombined.includes("kimia")) {
        subtes.push("Pengetahuan Kuantitatif", "Penalaran Matematika");
      }
      if (mCombined.includes("sosiologi") || mCombined.includes("ekonomi") || mCombined.includes("geografi")) {
        subtes.push("Pengetahuan & Pemahaman Umum", "Literasi B. Indonesia");
      }

      document.getElementById('outSubtes').innerHTML = Array.from(new Set(subtes)).map(st => 
        `<span class="px-3 py-1 bg-amber-950 border border-amber-800/60 text-amber-300 rounded-lg text-xs">${st}</span>`
      ).join('');

      document.getElementById('resultBox').classList.remove('hidden');
    }

    // Auto load saat web dibuka
    loadData();
  </script>
</body>
</html>
